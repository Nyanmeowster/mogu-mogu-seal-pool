<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#bcebe8">
  <meta name="description" content="陪伴有名字、有個性、會回應你的 2D 小海豹：餵食、摸摸、玩水與日常照護。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="MOGU MOGU｜我的海豹泳池">
  <meta property="og:description" content="有名字、有作息，也會記得你。陪伴小海豹生活、照護、探索並累積共同回憶。">
  <meta property="og:image" content="https://nyanmeowster.github.io/mogu-mogu-seal-pool/og-v2.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MOGU MOGU｜我的海豹泳池">
  <meta name="twitter:description" content="有名字、有作息，也會記得你。陪伴小海豹生活、照護、探索並累積共同回憶。">
  <meta name="twitter:image" content="https://nyanmeowster.github.io/mogu-mogu-seal-pool/og-v2.png">
  <title>MOGU MOGU｜我的海豹泳池</title>
  <link rel="stylesheet" href="/style.css?v=50">
</head>
<body>
  <div id="app-loader" class="app-loader" role="status" aria-live="polite" aria-label="正在準備海豹泳池">
    <div class="loader-card">
      <span class="loader-seal" aria-hidden="true">●ᴥ●</span>
      <small>MOGU MOGU</small>
      <h2>正在準備海豹泳池</h2>
      <p id="loading-text">載入海豹體型與互動素材…</p>
      <div class="loading-track" aria-hidden="true"><i id="loading-bar"></i></div>
      <strong id="loading-percent">0%</strong>
    </div>
  </div>
  <main class="pet-app">
    <header class="pet-header">
      <div class="pet-brand"><span>●</span><div><small>MOGU MOGU</small><h1><b id="seal-name-title">Mogu</b> 的海豹泳池</h1></div></div>
      <div class="header-actions">
        <button id="sound-toggle" class="sound-toggle" type="button" aria-label="音效" aria-pressed="true"><span aria-hidden="true">🔊</span></button>
        <div class="coin-pill" aria-label="海豹幣"><span aria-hidden="true">🪙</span><strong id="coins">11</strong></div>
      </div>
    </header>
    <p class="care-ethics"><span aria-hidden="true">🌊</span> 專業照護模擬 · 野生海豹受保護，請勿靠近、觸摸或餵食</p>
    <section class="life-strip" aria-label="海豹生活狀態">
      <div><span id="phase-icon" aria-hidden="true">☀️</span><small>目前作息</small><strong id="phase-label">白日探索</strong></div>
      <div><span id="personality-icon" aria-hidden="true">🤍</span><small>海豹個性</small><strong id="personality-label">溫柔黏人</strong></div>
    </section>
    <section class="status-panel" aria-label="海豹狀態">
      <div id="satiety-status" class="status-item satiety-status"><div class="status-icon" aria-hidden="true">🐟</div><div class="status-main"><div class="status-copy"><span>飽足度</span><strong id="satiety-text">35%</strong></div><div id="satiety-meter" class="meter" role="progressbar" aria-label="飽足度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="35"><i id="satiety-bar" class="satiety-meter"></i></div></div></div>
      <div id="affection-status" class="status-item affection-status"><div class="status-icon" aria-hidden="true">♥</div><div class="status-main"><div class="status-copy"><span>信任度</span><strong id="affection-text">20%</strong></div><div id="affection-meter" class="meter" role="progressbar" aria-label="信任度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="20"><i id="affection-bar" class="love-meter"></i></div></div></div>
      <div id="health-status" class="status-item health-status"><div class="status-icon" aria-hidden="true">🩺</div><div class="status-main"><div class="status-copy"><span>健康</span><strong id="health-text">90%</strong></div><div id="health-meter" class="meter" role="progressbar" aria-label="健康" aria-valuemin="0" aria-valuemax="100" aria-valuenow="90"><i id="health-bar" class="health-meter"></i></div></div></div>
      <div id="water-status" class="status-item water-status"><div class="status-icon" aria-hidden="true">💧</div><div class="status-main"><div class="status-copy"><span>水質</span><strong id="water-text">86%</strong></div><div id="water-meter" class="meter" role="progressbar" aria-label="水質" aria-valuemin="0" aria-valuemax="100" aria-valuenow="86"><i id="water-bar" class="water-meter"></i></div></div></div>
    </section>
    <section id="pool" class="pool-scene mode-home" aria-label="小海豹活動區">
      <div class="sky-glow"></div>
      <div class="cloud cloud-a"></div><div class="cloud cloud-b"></div>
      <div class="far-shore"></div><div class="pool-rim"></div>
      <div class="water-lines"></div><div class="water-caustics"></div>
      <div class="bubble-field" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div id="stage-pill" class="stage-pill">健康體型</div>
      <div id="decorations"></div>
      <div id="speech" class="speech">今天要一起玩什麼？</div>
      <div id="seal-roamer" class="seal-roamer stage-2">
        <button id="seal" class="pet-seal" aria-label="和小海豹互動">
          <span id="seal-art-wrap" class="seal-art-wrap"><span id="seal-sprite" class="seal-sprite" aria-hidden="true"></span><span id="seal-action-sprite" class="seal-action-sprite" aria-hidden="true"></span><span id="seal-jaw-sprite" class="seal-jaw-sprite" aria-hidden="true"></span></span>
          <span id="seal-hit-map" class="seal-hit-map" aria-hidden="true"></span>
          <span id="reaction-icon" class="reaction-icon" hidden>♥</span>
        </button>
      </div>
      <div id="notice" class="notice" aria-live="polite">歡迎回來～</div>
      <div class="foreground-water" aria-hidden="true"><i></i><i></i><i></i></div>
    </section>
    <section id="drawer" class="action-drawer closed" aria-live="polite" tabindex="-1"></section>
    <aside id="onboarding-tip" class="onboarding-tip" aria-live="polite" hidden>
      <span id="onboarding-copy"></span>
      <button id="onboarding-skip" type="button">先自己探索</button>
    </aside>
    <nav class="bottom-nav" aria-label="主要功能">
      <button data-mode="pet" aria-controls="drawer" aria-expanded="false" aria-pressed="false"><span aria-hidden="true">🤍</span><small>陪伴</small></button>
      <button data-mode="feed" aria-controls="drawer" aria-expanded="false" aria-pressed="false"><span aria-hidden="true">🐟</span><small>餵食</small></button>
      <button data-mode="care" aria-controls="drawer" aria-expanded="false" aria-pressed="false"><span aria-hidden="true">🩺</span><small>照護</small></button>
      <button data-mode="shop" aria-controls="drawer" aria-expanded="false" aria-pressed="false"><span aria-hidden="true">🏠</span><small>小屋</small></button>
    </nav>
  </main>
  <div id="dead-overlay" class="dead-overlay" role="dialog" aria-modal="true" aria-labelledby="dead-title" aria-describedby="care-pause-copy care-preserved-note" tabindex="-1" hidden>
    <div class="dead-card"><span id="care-pause-icon" aria-hidden="true">🚑</span><small id="care-pause-label">專業照護已接手</small><h2 id="dead-title">小海豹正在安全休養</h2><p id="care-pause-copy">名字、共同回憶、成就與收藏都會保留，準備好後就能接牠回泳池。</p><p id="care-preserved-note" class="care-preserved-note"><span aria-hidden="true">🤍</span> 你們累積的一切都不會歸零</p><button id="adopt" type="button">接牠回泳池</button></div>
  </div>
  <div id="profile-overlay" class="profile-overlay" role="dialog" aria-modal="true" aria-labelledby="profile-title" aria-describedby="profile-description" tabindex="-1" hidden>
    <form id="profile-form" class="profile-card">
      <span class="profile-seal" aria-hidden="true">●ᴥ●</span><small>建立專屬身分</small><h2 id="profile-title">牠要叫什麼名字？</h2><p id="profile-description">名字與相遇日會保存在生活紀錄裡，之後也能修改。</p>
      <label>海豹名字<input id="profile-name" name="name" maxlength="12" value="Mogu" autocomplete="off" required></label>
      <label>生日或相遇日<input id="profile-birthday" name="birthday" type="date"></label>
      <div class="profile-actions"><button id="profile-cancel" class="profile-cancel" type="button" hidden>取消</button><button id="profile-submit" type="submit">開始一起生活</button></div>
    </form>
  </div>
  <script type="module" src="/app.js?v=50"></script>
</body>
</html>
